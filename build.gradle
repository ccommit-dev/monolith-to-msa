plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ccommit'
version = '0.0.1-SNAPSHOT'
description = 'monolith-to-msa for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Actuator (Health Check)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 텍스트 포맷(/actuator/prometheus) — 없으면 HTTP 메트릭이 스크랩되지 않음
	implementation 'io.micrometer:micrometer-registry-prometheus'
	
	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// Retry
	implementation 'org.springframework.retry:spring-retry:2.0.5'
	implementation 'org.springframework:spring-aspects'

	// Database
	implementation 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	// Redis Cache
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	
	// Jackson (JSON 직렬화)
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Dev Tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// WebClient (Reactive Web)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'io.projectreactor.netty:reactor-netty-http'  // Reactor Netty HTTP 클라이언트
	implementation 'io.projectreactor:reactor-core'  // Reactor Core (Mono, Flux 등)
	
	// Netty Native DNS Resolver (MacOS 성능 향상)
	// 주의: 네이티브 라이브러리 로드 실패 시 경고 발생 (기능에는 영향 없음)
	// 로깅 레벨을 OFF로 설정하여 경고 숨김
	// runtimeOnly 'io.netty:netty-resolver-dns-native-macos'

	// Resilience4j (Circuit Breaker, Retry, Timeout)
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
	implementation 'io.github.resilience4j:resilience4j-reactor:2.1.0'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Retry 활성화
tasks.named('compileJava') {
	options.annotationProcessorPath = configurations.annotationProcessor
}

// plain.jar 생성 비활성화 (실행 가능한 JAR만 생성)
jar {
	enabled = false
}

// bootJar만 활성화 (실행 가능한 JAR)
bootJar {
	enabled = true
	archiveClassifier = '' // classifier 제거하여 기본 이름 사용
}
