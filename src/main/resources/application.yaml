spring:
  application:
    name: monolith-to-msa
  
  # Database 설정
  datasource:
    # 메모리 DB (개발용 - 애플리케이션 종료 시 데이터 삭제)
    url: jdbc:h2:mem:testdb
    # 파일 DB 사용 시 아래 주석 해제
    # url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
    # HikariCP 커넥션 풀 설정 (병목 재현용: max 10)
    hikari:
      maximum-pool-size: 10  # 최대 커넥션 수 (병목 재현을 위해 낮게 설정)
      minimum-idle: 5         # 최소 유휴 커넥션 수
      connection-timeout: 30000  # 커넥션 획득 대기 시간 (30초)
      idle-timeout: 600000   # 유휴 커넥션 타임아웃 (10분)
      max-lifetime: 1800000   # 커넥션 최대 생명주기 (30분)
      leak-detection-threshold: 60000  # 커넥션 누수 감지 (60초)
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true  # data.sql 실행을 위해 필요
  
  # SQL 초기화 설정
  sql:
    init:
      mode: always  # 항상 data.sql 실행
      continue-on-error: false  # 오류 발생 시 중단
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false
  
  # Redis Cache 설정
  # Redis가 없으면 type을 simple로 변경
  cache:
    type: simple  # Redis 없이 테스트 시: type: simple, Redis 사용 시: type: redis
    redis:
      time-to-live: 3600000  # 기본 TTL: 3600초 (1시간)
  
  # Redis 설정 (Redis 사용 시 주석 해제)
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     timeout: 2000ms
  #     lettuce:
  #       pool:
  #         max-active: 8
  #         max-idle: 8
  #         min-idle: 0

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Server 설정
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always