spring:
  application:
    name: monolith-to-msa
  
  # Database 설정
  datasource:
    # 메모리 DB (개발용 - 애플리케이션 종료 시 데이터 삭제)
    url: jdbc:h2:mem:testdb
    # 파일 DB 사용 시 아래 주석 해제
    # url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false
  
  # Redis Cache 설정
  # Redis가 없으면 type을 simple로 변경
  cache:
    type: redis  # Redis 없이 테스트 시: type: simple
    redis:
      time-to-live: 3600000  # 기본 TTL: 3600초 (1시간)
  
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Server 설정
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always